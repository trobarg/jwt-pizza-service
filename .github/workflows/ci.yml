name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    services:
      mysql:
        image: mysql:8.0.29
        env:
          # Throwaway password: this container lives only for this job and should only be reachable from the runner.
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptempdbpassword"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Write config file
        # Secrets are read from the environment at runtime, so they should never be written to disk or spliced into shell.
        run: |
          cat > src/config.js <<'EOF'
          module.exports = {
            jwtSecret: process.env.JWT_SECRET,
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'tempdbpassword',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: process.env.FACTORY_API_KEY,
            },
          };
          EOF

      - name: Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test

      - name: Set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s"}\n' "$version" > src/version.json

      - name: Update coverage badge
        env:
          NET_ID: ${{ secrets.NET_ID }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(awk -v c="$coverage" 'BEGIN { print (c >= 80) ? "green" : "red" }')
          curl -sSf -X POST "https://pizza-factory.cs329.click/api/badge/${NET_ID}/jwtpizzaservicecoverage?label=Coverage&value=${coverage}%25&color=${color}" \
            -H "authorization: bearer ${FACTORY_API_KEY}" \
            -o /dev/null

      - name: Create dist
        run: |
          mkdir dist
          cp Dockerfile dist
          cp -r src/* dist
          cp *.json dist
          sed -i "s/root/${{ secrets.DB_USERNAME }}/g" dist/config.js
          sed -i "s/tempdbpassword/${{ secrets.DB_PASSWORD }}/g" dist/config.js
          sed -i "s/127.0.0.1/${{ secrets.DB_HOSTNAME }}/g" dist/config.js

      - name: Update distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: build
    env:
      version: ${{needs.build.outputs.version}}
    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v8.0.2
      with:
        name: package

    - name: Create OIDC token to AWS
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        audience: sts.amazonaws.com
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}
    
    - name: Create OIDC token to AWS
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        audience: sts.amazonaws.com
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Set up machine emulation
      uses: docker/setup-qemu-action@v4.4.0
    
    - name: Set up Docker build
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build and push container image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: 'jwt-pizza-service'
      run: |
        docker build --platform=linux/arm64 -t $ECR_REGISTRY/$ECR_REPOSITORY --push .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >>  $GITHUB_OUTPUT